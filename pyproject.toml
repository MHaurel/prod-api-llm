[project]
name = "prod-api-llm"
version = "0.1.0"
description = "A practical FastAPI service backed by an LLM through OpenRouter."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "langchain-openai>=0.3,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
